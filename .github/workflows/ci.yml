name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Software and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Python parsing packages (no weights)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r runtime/requirements.lock
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate:evidence
      - run: npm run check:publication
      - run: python -m compileall -q runtime scripts
      - run: npm audit --audit-level=high
