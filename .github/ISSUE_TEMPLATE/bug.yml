name: Bug report
description: Report a reproducible product or setup problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic examples and redact logs. Report security vulnerabilities privately via SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and minimal example
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and model profiles
      description: OS/architecture, Node/Python versions, model IDs and whether the endpoint is local. No keys.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Relevant logs and checks run
